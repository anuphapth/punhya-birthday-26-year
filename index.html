<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>จดหมายจากหมวด</title>

    <!-- Browser tab icon (favicon) -->
    <link rel="icon" type="image/png" href="assets/images/mail.png" />
    <link rel="apple-touch-icon" href="assets/images/mail.png" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Itim&family=Prompt:wght@300;400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="heart">♡</div>
      <div class="heart">♡</div>
      <div class="heart">♡</div>
      <div class="heart">♡</div>

      <div class="envelope-wrap" id="envelopeWrap" aria-label="เปิดจดหมาย">
        <div class="envelope">
          <div class="envelope-back"></div>
          <div class="flap" id="flap"></div>
          <div class="envelope-front"></div>
        </div>
      </div>

      <div class="letter" id="letter">
        <div class="letter-inner" id="letterInner">
          <section class="page front">
            <h1>Happy Birthday</h1>
            <h2>26 Years</h2>

            <div class="photo">
              <!-- Replace assets/images/birthday.jpg with the real photo of Punhya.
                   A portrait image with a 3:4 ratio (e.g. 1536x2048) matches the CSS frame exactly. -->
              <img
                src="assets/images/birthday.jpg"
                alt="รูปเจ้าของวันเกิด"
                onerror="
                  this.style.display = 'none';
                  this.nextElementSibling.style.display = 'grid';
                "
              />
              <div class="placeholder" style="display: none">
                ใส่รูปของปั้นหยาในไฟล์<br /><b>assets/images/birthday.jpg</b>
              </div>
            </div>

            <button class="flip-btn" id="flipBtn">พลิกไปอ่านอีกหน้า →</button>
          </section>

          <section class="page back">
            <h1>ถึงปั้นหยา</h1>
            <p style="max-width: 330px">
              สุขสันต์วันเกิดนะที่รัก<br />
              ขอให้มีความสุขมาก ๆ ในทุกวัน<br />
            </p>
            <p style="font-family: Itim; font-size: 25px; margin-top: 20px">
              ไปกินบุฟเฟต์กันนน~~~
            </p>
            <p style="margin-top: 25px">จากหมวด</p>
          </section>
        </div>
      </div>

      <!-- The seal always lives outside the envelope so its z-index can be swapped in front of it
           / behind it. On page load it sits behind the envelope: it exists from the first frame
           (no re-render while the envelope flips) but is completely hidden by it. -->
      <div class="seal" id="seal">♥</div>

      <div class="hint" id="hint">
        <strong>จดหมายจากหมวด</strong>
        <small>กดที่ซองจดหมายเพื่อเปิด</small>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
